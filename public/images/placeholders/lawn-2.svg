<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" width="720" height="560" role="img" aria-label="Sports field artificial turf placeholder">
  <defs>
    <linearGradient id="l2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a9836"/><stop offset="1" stop-color="#2d6024"/>
    </linearGradient>
  </defs>
  <rect width="720" height="560" fill="url(#l2)"/>
  <!-- field stripes -->
  <g fill="#5f9f2e">
    <rect x="0" y="0" width="720" height="80"/>
    <rect x="0" y="160" width="720" height="80"/>
    <rect x="0" y="320" width="720" height="80"/>
    <rect x="0" y="480" width="720" height="80"/>
  </g>
  <!-- markings -->
  <g fill="none" stroke="#f4f1e6" stroke-width="4" opacity="0.85">
    <rect x="40" y="40" width="640" height="480"/>
    <line x1="360" y1="40" x2="360" y2="520"/>
    <circle cx="360" cy="280" r="80"/>
    <rect x="40" y="190" width="120" height="180"/>
    <rect x="560" y="190" width="120" height="180"/>
  </g>
  <circle cx="360" cy="280" r="4" fill="#f4f1e6"/>
</svg>
