<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Pool and garden scene placeholder">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b3a4a"/>
      <stop offset="0.55" stop-color="#127591"/>
      <stop offset="1" stop-color="#43a4b8"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc4d2"/>
      <stop offset="1" stop-color="#115e78"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a9836"/>
      <stop offset="1" stop-color="#2d6024"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f4f1e6" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f4f1e6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1280" cy="220" r="320" fill="url(#sun)"/>
  <circle cx="1280" cy="220" r="90" fill="#f4f1e6" opacity="0.85"/>
  <!-- Lawn -->
  <path d="M0 700 C 400 640 1200 640 1600 700 L1600 900 L0 900 Z" fill="url(#grass)"/>
  <!-- Deck -->
  <rect x="0" y="640" width="1600" height="70" fill="#c8a06a"/>
  <g stroke="#a87f4a" stroke-width="2" opacity="0.6">
    <line x1="0" y1="660" x2="1600" y2="660"/>
    <line x1="0" y1="680" x2="1600" y2="680"/>
  </g>
  <!-- Pool -->
  <rect x="240" y="430" width="1120" height="230" rx="40" fill="url(#water)"/>
  <rect x="240" y="430" width="1120" height="230" rx="40" fill="none" stroke="#0b3a4a" stroke-width="6" opacity="0.4"/>
  <!-- Water reflections -->
  <g stroke="#d4f2f6" stroke-width="6" stroke-linecap="round" opacity="0.35">
    <line x1="340" y1="500" x2="520" y2="500"/>
    <line x1="640" y1="560" x2="900" y2="560"/>
    <line x1="980" y1="520" x2="1160" y2="520"/>
    <line x1="420" y1="610" x2="600" y2="610"/>
  </g>
  <!-- Plant silhouettes -->
  <g fill="#21401d" opacity="0.85">
    <circle cx="140" cy="640" r="80"/>
    <circle cx="220" cy="660" r="60"/>
    <circle cx="1460" cy="650" r="90"/>
    <circle cx="1380" cy="665" r="55"/>
  </g>
</svg>
