<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" width="720" height="560" role="img" aria-label="Artificial lawn residential placeholder">
  <defs>
    <linearGradient id="l1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6cb35a"/><stop offset="1" stop-color="#2d6024"/>
    </linearGradient>
    <pattern id="blade1" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M5 9 L3 1 M5 9 L7 1 M5 9 L5 0" stroke="#21401d" stroke-width="1" opacity="0.35"/>
    </pattern>
  </defs>
  <rect width="720" height="560" fill="url(#l1)"/>
  <rect width="720" height="560" fill="url(#blade1)"/>
  <!-- patio corner -->
  <rect x="0" y="0" width="220" height="160" fill="#c8a06a" opacity="0.85"/>
  <g stroke="#a87f4a" stroke-width="2" opacity="0.5">
    <line x1="0" y1="40" x2="220" y2="40"/><line x1="0" y1="80" x2="220" y2="80"/>
    <line x1="0" y1="120" x2="220" y2="120"/><line x1="110" y1="0" x2="110" y2="160"/>
  </g>
  <!-- loungers -->
  <g fill="#0b3a4a">
    <rect x="420" y="70" width="160" height="40" rx="8"/>
    <rect x="430" y="110" width="150" height="14" rx="4"/>
  </g>
  <g fill="#f4f1e6" opacity="0.7">
    <circle cx="380" cy="430" r="60"/><circle cx="640" cy="450" r="46"/>
  </g>
</svg>
