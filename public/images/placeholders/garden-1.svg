<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" width="720" height="560" role="img" aria-label="Garden with lawn and drip irrigation placeholder">
  <defs>
    <linearGradient id="g1sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eefbfd"/><stop offset="1" stop-color="#d4f2f6"/>
    </linearGradient>
    <linearGradient id="g1lawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6cb35a"/><stop offset="1" stop-color="#387a29"/>
    </linearGradient>
  </defs>
  <rect width="720" height="560" fill="url(#g1sky)"/>
  <rect x="0" y="360" width="720" height="200" fill="url(#g1lawn)"/>
  <!-- garden bed -->
  <rect x="0" y="300" width="720" height="70" fill="#9c7a4f"/>
  <!-- drip line droplets -->
  <g fill="#3ab1c4">
    <circle cx="120" cy="320" r="4"/><circle cx="220" cy="322" r="4"/>
    <circle cx="340" cy="320" r="4"/><circle cx="460" cy="322" r="4"/>
    <circle cx="580" cy="320" r="4"/>
  </g>
  <!-- bushes / plants -->
  <g fill="#2d6024">
    <circle cx="120" cy="290" r="46"/><circle cx="240" cy="285" r="58"/>
    <circle cx="380" cy="292" r="50"/><circle cx="520" cy="288" r="62"/>
    <circle cx="640" cy="295" r="48"/>
  </g>
  <g fill="#93cb80" opacity="0.7">
    <circle cx="110" cy="276" r="16"/><circle cx="520" cy="270" r="20"/>
  </g>
  <!-- sun -->
  <circle cx="600" cy="90" r="50" fill="#f4f1e6" opacity="0.9"/>
</svg>
