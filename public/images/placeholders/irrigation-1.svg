<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" width="720" height="560" role="img" aria-label="Irrigation system placeholder">
  <defs>
    <linearGradient id="irgrass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6cb35a"/><stop offset="1" stop-color="#387a29"/>
    </linearGradient>
  </defs>
  <rect width="720" height="560" fill="url(#irgrass)"/>
  <!-- mowing stripes -->
  <g fill="#2d6024" opacity="0.25">
    <rect x="0" y="0" width="720" height="70"/>
    <rect x="0" y="140" width="720" height="70"/>
    <rect x="0" y="280" width="720" height="70"/>
    <rect x="0" y="420" width="720" height="70"/>
  </g>
  <!-- sprinkler arcs (water) -->
  <g fill="none" stroke="#d4f2f6" stroke-width="4" opacity="0.75" stroke-linecap="round">
    <path d="M360 300 q -160 -180 -300 -40"/>
    <path d="M360 300 q 160 -180 300 -40"/>
    <path d="M360 300 q -140 -160 -240 -160"/>
    <path d="M360 300 q 140 -160 240 -160"/>
    <path d="M360 300 q -90 -120 -120 -210"/>
    <path d="M360 300 q 90 -120 120 -210"/>
  </g>
  <!-- sprinkler head -->
  <circle cx="360" cy="304" r="14" fill="#144055"/>
  <circle cx="360" cy="304" r="6" fill="#74cedb"/>
  <!-- droplets -->
  <g fill="#ace4ec">
    <circle cx="120" cy="120" r="5"/><circle cx="600" cy="110" r="5"/>
    <circle cx="240" cy="90" r="4"/><circle cx="500" cy="95" r="4"/>
  </g>
</svg>
